<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>To-do</h1>

    <!-- input for new task title (give it an id) -->
    <input type="text" id="taskInput" placeholder="What needs doing?">

    <!-- add button (give it an id) -->
    <button id="addBtn">Add</button>

    <!-- empty list — JavaScript fills this -->
    <ul id="taskList"></ul>

    <script src="app.js"></script>
</body>
</html>
